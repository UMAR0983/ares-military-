<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <!-- Glow filter -->
        <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <linearGradient id="goldCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffaa00" />
            <stop offset="50%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#00ff88" />
        </linearGradient>
    </defs>

    <!-- Outer Octagonal Shield -->
    <polygon points="100,5 170,30 195,100 170,170 100,195 30,170 5,100 30,30" 
             fill="rgba(5, 8, 14, 0.95)" stroke="#00f0ff" stroke-width="3" filter="url(#cyanGlow)" />
    <polygon points="100,12 163,35 186,100 163,165 100,188 37,165 14,100 37,35" 
             fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" stroke-dasharray="4,2" />

    <!-- Crosshair Target Ring -->
    <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
    <line x1="100" y1="10" x2="100" y2="190" stroke="rgba(0,240,255,0.15)" stroke-width="1"/>
    <line x1="10" y1="100" x2="190" y2="100" stroke="rgba(0,240,255,0.15)" stroke-width="1"/>

    <!-- STYLIZED MARKHOR HEAD & SPIRAL HORNS -->
    <!-- Left Spiral Horn -->
    <path d="M 90,70 Q 60,40 45,20 Q 30,5 45,25 Q 65,50 80,80 Z" fill="url(#goldCyanGrad)" />
    <path d="M 85,65 Q 55,35 38,15 Q 50,30 75,70" fill="none" stroke="#ffaa00" stroke-width="2" />

    <!-- Right Spiral Horn -->
    <path d="M 110,70 Q 140,40 155,20 Q 170,5 155,25 Q 135,50 120,80 Z" fill="url(#goldCyanGrad)" />
    <path d="M 115,65 Q 145,35 162,15 Q 150,30 125,70" fill="none" stroke="#ffaa00" stroke-width="2" />

    <!-- Markhor Head Polygon Face -->
    <polygon points="100,145 75,90 85,65 100,60 115,65 125,90" 
             fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="2" />

    <!-- Cyber Eyes -->
    <polygon points="85,82 93,85 87,90" fill="#00ff88" />
    <polygon points="115,82 107,85 113,90" fill="#00ff88" />

    <!-- Beard Lines -->
    <path d="M 95,145 L 100,165 L 105,145" fill="none" stroke="#00f0ff" stroke-width="2" />

    <!-- ARES Banner Text -->
    <text x="100" y="182" text-anchor="middle" fill="#00f0ff" font-size="14" font-weight="bold" font-family="'Rajdhani', sans-serif" letter-spacing="3">ARES</text>
</svg>
